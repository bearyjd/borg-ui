name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The smoke scripts declare "ASCII only" in their own headers, because
      # Windows PowerShell 5.1 reads UTF-8-without-BOM as ANSI and a non-ASCII
      # byte can break parsing. Nothing enforced it, and two scripts had picked
      # up em-dashes from comment edits. Cheap to check here; the alternative is
      # discovering it on a VM run that only happens by hand.
      - name: Smoke scripts are ASCII-only
        run: |
          if bad=$(grep -rlP '[^\x00-\x7F]' tests/smoke-windows/*.ps1); then
            echo "Non-ASCII bytes in PowerShell smoke scripts:"
            echo "$bad"
            grep -rnP '[^\x00-\x7F]' tests/smoke-windows/*.ps1 | head -20
            exit 1
          fi
          echo "All smoke scripts are ASCII-only."

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    # Build with the static CRT so this job matches the shipped release build
    # (see .cargo/config.toml) and guards it — a dependency that breaks static
    # linking fails here at PR time. Overrides the workflow-level RUSTFLAGS
    # (an env RUSTFLAGS would otherwise shadow .cargo/config.toml's flags).
    env:
      RUSTFLAGS: "-C target-feature=+crt-static -D warnings"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # tauri-build's build script reads the Windows-only tauri.windows.conf.json
      # overlay, which declares the bundled-borg resource dir. Real borg is only
      # needed to package an installer (Release workflow); for a compile/lint
      # check a placeholder satisfies the build script's resource-path check.
      - name: Create placeholder borg resource
        shell: pwsh
        run: |
          $dir = "app-tauri/src-tauri/binaries/borg"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          New-Item -ItemType File -Force -Path "$dir/borg.exe" | Out-Null

      # Compiles and lints the cfg(windows) code that the Linux job never
      # builds (VSS, scheduler, power/WLAN, removable, cloud placeholders,
      # atomic replace). Catches Windows-only breaks at PR time instead of
      # at release time. --all-targets also compiles the cfg(windows) tests.
      - name: Clippy (Windows)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-tauri
    steps:
      - uses: actions/checkout@v5

      # pnpm to match packageManager in app-tauri/package.json and the
      # release workflow — a second npm lockfile drifts out of sync silently.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app-tauri/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        run: pnpm exec svelte-kit sync

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test
